<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroMatrix LMS</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #070b16;
      color: #e2e8f0;
      font-family: 'IBM Plex Mono', monospace;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
      background: #0a0e1a;
      border-bottom: 1px solid #1e2a4a;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .app-header {
      padding: 16px 20px;
      background: #0d1428;
      border-bottom: 1px solid #1e2a4a;
    }

    .open-app-btn {
      display: none;
      text-align: center;
      padding: 10px;
      background: #0f172a;
    }

    .open-app-btn a {
      display: inline-block;
      padding: 10px 16px;
      background: linear-gradient(90deg, #2563eb, #1d4ed8);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    /* show only on mobile */
    @media (max-width: 768px) {
      .open-app-btn {
        display: block;
      }
    }

    .iframe-container {
      position: fixed;
      top: 120px; /* leaves space for nav + header */
      left: 0;
      width: 100%;
      height: calc(100dvh - 120px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <nav>
    <div>NEUROMATRIX LMS</div>
    <div>● LIVE</div>
  </nav>

  <div class="app-header">
    <h3>NeuroMatrix Learning System</h3>
  </div>

  <!-- MOBILE BUTTON -->
  <div class="open-app-btn">
    <a href="https://ademideola-multi-lecture-dashboard.hf.space" target="_blank">
      🚀 Open Fullscreen LMS
    </a>
  </div>

  <!-- SINGLE IFRAME ONLY -->
  <div class="iframe-container">
    <iframe
      src="https://ademideola-multi-lecture-dashboard.hf.space"
      allow="accelerometer; camera; microphone"
    ></iframe>
  </div>

</body>
</html>
